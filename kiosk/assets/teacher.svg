<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="CS &amp; IT Practicum Instructor">
  <!--
    Teacher / Lab Advisor Portrait Graphic (kiosk/assets/teacher.svg)
    Students: You can replace this file or change `IMAGE_MAP.teacher` in
    `kiosk/displays/info.js` to point to a real photo like `assets/teacher.jpg`!
  -->
  <rect width="400" height="400" rx="40" fill="#2d0060" />
  <circle cx="200" cy="185" r="145" fill="#1a0030" stroke="#ffd700" stroke-width="8" />

  <!-- Shoulders / Blazer -->
  <path d="M95 315 C110 245, 290 245, 305 315 Z" fill="#1e3a8a" stroke="#ffd700" stroke-width="5" />
  <!-- Lanyard & ID Badge -->
  <polyline points="170,255 200,305 230,255" fill="none" stroke="#ffd700" stroke-width="6" />
  <rect x="184" y="295" width="32" height="22" rx="4" fill="#f8fafc" />

  <!-- Head & Glasses -->
  <circle cx="200" cy="175" r="56" fill="#ffe6f5" stroke="#1a0030" stroke-width="5" />
  <rect x="152" y="158" width="40" height="26" rx="6" fill="none" stroke="#80ffd8" stroke-width="6" />
  <rect x="208" y="158" width="40" height="26" rx="6" fill="none" stroke="#80ffd8" stroke-width="6" />
  <line x1="192" y1="170" x2="208" y2="170" stroke="#80ffd8" stroke-width="6" />

  <!-- Smile -->
  <path d="M180 202 Q200 216 220 202" fill="none" stroke="#1a0030" stroke-width="5" stroke-linecap="round" />

  <!-- Label Banner -->
  <rect x="65" y="325" width="270" height="44" rx="10" fill="#ffd700" stroke="#1a0030" stroke-width="5" />
  <text x="200" y="355" text-anchor="middle" font-family="monospace, sans-serif" font-size="22" font-weight="900" fill="#1a0030" letter-spacing="2">IT PRACTICUM LAB</text>
</svg>
